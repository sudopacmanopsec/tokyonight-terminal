# ==============================================================================
# ~/.config/tmux/tmux.conf   (Tokyo Night, simple, nvim + zsh friendly)
# Needs tmux 3.3+ and wl-clipboard (Wayland copy):  Void: xbps-install tmux wl-clipboard
#                                                   Gentoo: emerge app-misc/tmux gui-apps/wl-clipboard
# Prefix is Ctrl+Space (no clash with zsh Ctrl+A/Ctrl+P/Ctrl+F or nvim)
# ==============================================================================

# ---- core --------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,xterm-256color:RGB"   # true color (foot etc.)
set -sg escape-time 0            # no lag on <Esc> in nvim
set -g focus-events on           # lets nvim notice focus (autoread)
set -g mouse on
set -g history-limit 50000
set -g base-index 1              # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on       # no gaps after closing a window
set -g detach-on-destroy off     # closing a session jumps to another, not out
setw -g mode-keys vi

# ---- prefix ------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---- clipboard (Wayland) -----------------------------------------------------
set -g set-clipboard on
set -s copy-command 'wl-copy'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ---- splits & windows (keep current directory) -------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ---- moving around -----------------------------------------------------------
# prefix + h/j/k/l = pane focus (vim keys)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Alt + h/j/k/l = pane focus with NO prefix (fast)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
# Alt + 1..9 = jump to window
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
# prefix + H/J/K/L = resize (hold to repeat)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- sessions & popups (fzf, like VSCode quick switch) -----------------------
# prefix + f : fuzzy-switch session      prefix + n : new named session
# prefix + t : floating scratch terminal in current dir
bind f display-popup -E -w 50% -h 40% \
  "tmux list-sessions | cut -d: -f1 | fzf --reverse --border=rounded --prompt='session > ' --color='bg+:#283457,bg:#1a1b26,fg:#c0caf5,hl:#7dcfff,pointer:#7dcfff,prompt:#7dcfff' | xargs -r tmux switch-client -t"
bind n command-prompt -p "new session:" "new-session -s '%%'"
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# ---- reload ------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# prefix + ? : cheat sheet (replaces tmux's default key list)
bind ? display-popup -E -w 70% -h 85% "less -R ~/.config/tmux/help.txt"

# ==============================================================================
# TOKYO NIGHT
#   bg #1a1b26  fg #c0caf5  blue #7aa2f7  purple #bb9af7  cyan #7dcfff
#   green #9ece6a  yellow #e0af68  dim #565f89  sel #283457  line #3b4261
# ==============================================================================
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#c0caf5"

# left: session name pill
set -g status-left-length 30
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[default] "

# windows
set -g window-status-separator ""
set -g window-status-format "#[fg=#565f89] #I #W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#bb9af7,bold] #I #W #[default]"
set -g window-status-activity-style "fg=#e0af68"

# right: PREFIX indicator (so new users see it working), date, time
set -g status-right-length 80
set -g status-right "#{?client_prefix,#[bg=#e0af68#,fg=#1a1b26#,bold] PREFIX #[default] ,}#[fg=#565f89]%a %d %b  #[fg=#7aa2f7,bold]%H:%M "

# panes, messages, copy-mode, popups
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#283457,fg=#c0caf5"
set -g message-command-style "bg=#283457,fg=#7dcfff"
set -g mode-style "bg=#283457,fg=#c0caf5"
set -g popup-style "bg=#1a1b26,fg=#c0caf5"
set -g popup-border-style "fg=#7aa2f7"
setw -g clock-mode-colour "#7aa2f7"
